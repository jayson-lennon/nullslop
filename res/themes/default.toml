# Default — the built-in jinn theme
# This file is the single source of truth for the default theme colors.
# Installed to ~/.config/jinn/themes/default.toml

# Borders & focus
focus_accent = "yellow"
border_unfocused = "darkgray"
popup_title = "green"
sidebar_resize_accent = "green"

# Text
primary_text = [220, 220, 220]
muted_text = [116, 116, 116]
subagent_fg = [152, 128, 208]
subagent_bg = [70, 58, 105]
error_text = "red"

# Status
success = "green"
warning = "yellow"
streaming = "cyan"
node_awaiting_input = "cyan"

# Chat log backgrounds
gutter_bg = [25, 27, 30]
gutter_context_included = [16, 116, 127]
user_block_bg = [52, 53, 65]
tool_fg = [97, 105, 117]
tool_success_bg = [44, 55, 44]
tool_failure_bg = [60, 40, 40]
tool_pending_bg = [45, 45, 50]
challenge_alert_bg = [255, 200, 0]
challenge_alert_fg = [16, 16, 16]
compaction_block_bg = [60, 50, 80]
sources_header_bg = [255, 200, 0]
sources_header_fg = [16, 16, 16]
truncation_fg = [83, 83, 83]

# Picker
picker_active_marker = "green"
picker_selected_bg = [70, 72, 78]
picker_highlight_bg = [68, 71, 80]

# Tab bar
tab_active_fg = "black"
tab_active_bg = "yellow"
tab_inactive_fg = "gray"

# Selection highlight
selection_fg = [220, 220, 220]
selection_bg = [80, 82, 88]

# Provider picker
accent_action = [255, 165, 0]
age_fresh = "lightgreen"
age_stale = "red"

# Scroll indicator
scroll_indicator_bg = "black"

# Input mode badge (queue vs steer)
input_mode_queue = [0, 255, 100]
input_mode_steer = [202, 92, 230]

# Info popup (audit, debug)
infopopup_bg = [40, 44, 52]
infopopup_title = "yellow"
infopopup_border = "cyan"
infopopup_fg = [220, 220, 220]

# Quake bar (global overlay console)
quake_bar_bg = [42, 28, 24]
